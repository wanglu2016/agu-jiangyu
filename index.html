<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A股疆域图</title>
<meta name="description" content="一张会动的A股地图：2000年至2026年沪深两市5,555家公司（含已退市的338家）按行业划分的市值版图。行业是国，公司是城，面积是市值。">
<meta property="og:title" content="A股疆域图 · 一张会动的A股地图">
<meta property="og:description" content="拖动时间轴，看银行、石油石化、白酒、新能源、半导体、AI算力的版图怎么扩张、收缩。2000–2026。">

<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Layout: 一张"股海舆图"——行业是国、公司是城，地图占满左侧，右侧是可翻页的说明栏，时间轴是一条按行业分层的年表。 */
:root {
  --sea: #dde6e2;          /* 浅海：日间底色 */
  --sea-line: rgba(54, 92, 86, 0.16);
  --land-shadow: rgba(30, 50, 46, 0.22);
  --panel: #f6f4ee;
  --panel-2: #ece9e0;
  --line: rgba(40, 52, 48, 0.14);
  --line-2: rgba(40, 52, 48, 0.26);
  --fg: #1c2522;
  --fg-2: #4b5853;
  --fg-3: #7b8781;
  --gold: #8f6418;         /* 泥金：当前年份、选中 */
  --cinnabar: #b8432b;     /* 朱砂：退市标记 */
  --malachite: #2f7a63;    /* 石绿：可操作 */
  --halo: rgba(246, 244, 238, 0.92);
  --tip: rgba(28, 37, 34, 0.94);
  --tip-fg: #f3efe4;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
  --sans: "Noto Sans SC", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --panel-w: 372px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sea: #0d1a20; --sea-line: rgba(140, 190, 180, 0.10); --land-shadow: rgba(0, 0, 0, 0.55);
    --panel: #111e24; --panel-2: #172830; --line: rgba(210, 225, 215, 0.10); --line-2: rgba(210, 225, 215, 0.22);
    --fg: #ebe6d6; --fg-2: #b6bdb4; --fg-3: #7f8b86; --gold: #d8b66c; --cinnabar: #e2694c; --malachite: #79b9a0;
    --halo: rgba(13, 26, 32, 0.9); --tip: rgba(236, 231, 216, 0.96); --tip-fg: #14211f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sea: #0d1a20; --sea-line: rgba(140, 190, 180, 0.10); --land-shadow: rgba(0, 0, 0, 0.55);
  --panel: #111e24; --panel-2: #172830; --line: rgba(210, 225, 215, 0.10); --line-2: rgba(210, 225, 215, 0.22);
  --fg: #ebe6d6; --fg-2: #b6bdb4; --fg-3: #7f8b86; --gold: #d8b66c; --cinnabar: #e2694c; --malachite: #79b9a0;
  --halo: rgba(13, 26, 32, 0.9); --tip: rgba(236, 231, 216, 0.96); --tip-fg: #14211f; color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--fg); font-family: var(--sans); font-size: 14px; -webkit-font-smoothing: antialiased; overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sea); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

#app { position: fixed; inset: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) 0; display: grid; grid-template-columns: minmax(0, 1fr) var(--panel-w); grid-template-rows: minmax(0, 1fr) auto; }
#stage { position: relative; grid-column: 1; grid-row: 1; min-width: 0; min-height: 0; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }

/* 左上：图名与年月 */
#plate { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); top: 14px; pointer-events: none; max-width: min(520px, 70%); }
#plate .kicker { font-family: var(--serif); font-weight: 600; font-size: 13px; letter-spacing: 0.32em; color: var(--fg-2); }
#plate .when { font-family: var(--serif); font-weight: 900; font-size: clamp(30px, 4.2vw, 50px); line-height: 1.08; color: var(--fg); letter-spacing: 0.04em; margin-top: 2px; text-shadow: 0 0 10px var(--halo), 0 0 3px var(--halo); }
#plate .when small { font-size: 0.5em; font-weight: 600; letter-spacing: 0.08em; color: var(--fg-2); margin-left: 6px; }
#plate .sum { margin-top: 6px; font-size: 13px; color: var(--fg-2); text-shadow: 0 0 6px var(--halo); }
#plate .sum b { color: var(--fg); font-weight: 700; }
#plate.boxed { background: var(--panel); padding: 8px 12px 9px; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 2px 12px rgba(0,0,0,.12); }
#plate .legend { margin-top: 4px; font-size: 11.5px; color: var(--fg-3); text-shadow: 0 0 6px var(--halo); }
.hatchkey { display: inline-block; width: 11px; height: 11px; margin: 0 4px -1px 0; border: 1px solid var(--line-2); background: repeating-linear-gradient(135deg, var(--fg-3) 0 1px, transparent 1px 4px); }

/* 右上：图层开关 */
#tools { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); top: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.chipbtn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--panel); color: var(--fg-2); font-size: 12.5px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
.chipbtn[aria-pressed="true"] { color: var(--fg); border-color: var(--cinnabar); }
.chipbtn .dot { width: 10px; height: 10px; border-radius: 3px; border: 1.5px dashed var(--cinnabar); }
.zoombox { display: flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--panel); }
.zoombox button { width: 34px; height: 32px; border: 0; background: transparent; color: var(--fg-2); font-size: 17px; }
.zoombox button + button { border-left: 1px solid var(--line); }
#tgDelist { position: absolute; right: 14px; top: 58px; }
#survivor { position: absolute; right: 14px; top: 100px; max-width: 250px; padding: 9px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-size: 12.5px; line-height: 1.55; color: var(--fg-2); box-shadow: 0 2px 10px rgba(0,0,0,.08); }
#survivor b { color: var(--cinnabar); font-weight: 700; }

/* 悬停提示 */
#tip { position: absolute; z-index: 5; pointer-events: none; background: var(--tip); color: var(--tip-fg); padding: 8px 11px; border-radius: 9px; font-size: 12.5px; line-height: 1.5; max-width: 260px; box-shadow: 0 6px 22px rgba(0,0,0,.25); transform: translate(12px, 12px); }
#tip .t { font-weight: 700; font-size: 14px; }
#tip .s { opacity: .8; }
#tip .e { color: #e9a07f; }

/* 时间轴 */
#timebar { grid-column: 1; grid-row: 2; background: var(--panel); border-top: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
#playbox { display: flex; flex-direction: column; gap: 5px; align-items: center; min-width: 62px; }
#play { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--malachite); background: transparent; color: var(--malachite); display: grid; place-items: center; }
#play svg { width: 16px; height: 16px; fill: currentColor; }
#speed, #tmode { border: 0; background: transparent; color: var(--fg-3); font-size: 11.5px; padding: 0; white-space: nowrap; }
#tmode { color: var(--malachite); text-decoration: underline; text-underline-offset: 3px; }
#trackwrap { position: relative; min-width: 0; }
#track { width: 100%; height: 78px; display: block; cursor: pointer; touch-action: none; border-radius: 6px; }
#trackwrap .hint { position: absolute; right: 0; top: -2px; font-size: 11px; color: var(--fg-3); pointer-events: none; }

/* 右栏 */
#panel { grid-column: 2; grid-row: 1 / span 2; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#searchbox { position: relative; padding-block: 14px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
#search { width: 100%; box-sizing: border-box; height: 38px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel-2); padding: 0 12px; font-size: 14px; }
#search::placeholder { color: var(--fg-3); }
#suggest { position: absolute; left: 16px; right: 16px; top: 52px; z-index: 8; background: var(--panel); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.18); overflow: hidden; }
#suggest button { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: transparent; border-bottom: 1px solid var(--line); }
#suggest button:last-child { border-bottom: 0; }
#suggest button:hover, #suggest button.on { background: var(--panel-2); }
#suggest .n { font-weight: 700; }
#suggest .c { color: var(--fg-3); font-size: 12px; text-align: right; }
#suggest .m { grid-column: 1 / -1; color: var(--fg-3); font-size: 12px; }
#tabs { display: flex; gap: 0; padding-block: 8px 0; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); overflow-x: auto; border-bottom: 1px solid var(--line); }
#tabs button { border: 0; background: transparent; padding: 8px 4px 9px; color: var(--fg-3); font-size: 13.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; flex: none; }
#tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--gold); font-weight: 700; }
#pages { flex: 1; min-height: 0; overflow: auto; padding-block: 14px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page[hidden] { display: none; }
h2.sec { font-family: var(--serif); font-weight: 900; font-size: 21px; margin: 0; letter-spacing: 0.04em; text-wrap: balance; }
.range { color: var(--gold); font-size: 12.5px; letter-spacing: 0.06em; margin-top: 2px; }
.prose { line-height: 1.8; color: var(--fg-2); margin: 10px 0 0; font-size: 14px; }
.card { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.label { font-size: 12px; letter-spacing: 0.12em; color: var(--fg-3); margin-bottom: 8px; }
.event { display: flex; gap: 8px; align-items: baseline; font-size: 13.5px; line-height: 1.6; }
.event .m { color: var(--gold); min-width: 64px; font-size: 12.5px; }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 4px; border: 0; background: transparent; text-align: left; border-radius: 7px; width: 100%; }
.row:hover { background: var(--panel-2); }
.row .rk { color: var(--fg-3); font-size: 12px; text-align: right; }
.row .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm i { font-style: normal; color: var(--fg-3); font-size: 12px; margin-left: 6px; }
.row .v { color: var(--fg-2); font-size: 12.5px; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; vertical-align: -1px; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 92px 50px; gap: 8px; align-items: center; padding: 6px 4px; border: 0; background: transparent; width: 100%; text-align: left; border-radius: 7px; }
.srow:hover { background: var(--panel-2); }
.srow canvas { width: 92px; height: 22px; display: block; }
.srow .p { text-align: right; font-size: 13px; }
.fam { font-size: 11.5px; color: var(--fg-3); letter-spacing: 0.14em; margin: 12px 0 2px 4px; }
.facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 13.5px; margin-top: 12px; }
.facts dt { color: var(--fg-3); }
.facts dd { margin: 0; }
.chart { width: 100%; height: 150px; display: block; margin-top: 10px; }
.pill { display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line-2); color: var(--fg-2); margin-left: 6px; vertical-align: 2px; }
.pill.warn { border-color: var(--cinnabar); color: var(--cinnabar); }
.trail { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.trail span { font-size: 12.5px; padding: 3px 8px; border-radius: 6px; background: var(--panel-2); }
.empty { color: var(--fg-3); line-height: 1.7; }
.linkbtn { border: 0; background: transparent; color: var(--malachite); padding: 0; text-decoration: underline; text-underline-offset: 3px; }
.notes h3 { font-size: 15px; margin: 18px 0 6px; font-family: var(--serif); }
.notes p, .notes li { line-height: 1.75; color: var(--fg-2); font-size: 13.5px; }
.notes ul { padding-left: 18px; margin: 6px 0; }
.notes a { color: var(--malachite); }
.notes code { font-size: 12px; background: var(--panel-2); padding: 1px 4px; border-radius: 4px; }
.foot { margin-top: 18px; font-size: 12px; color: var(--fg-3); line-height: 1.6; }

#tabs a.out { flex: none; padding: 8px 2px 9px; font-size: 13px; color: var(--malachite); text-decoration: none; white-space: nowrap; font-weight: 700; }
#tabs a.out:first-of-type { margin-left: auto; }
#tabs a.out.zz::after { content: ""; display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-top: 1.5px solid currentColor; border-right: 1.5px solid currentColor; transform: rotate(45deg) translateY(-1px); }
#tabs a.out:hover { text-decoration: underline; text-underline-offset: 3px; }
.finbars { display: block; width: 100%; height: 64px; margin: 6px 0 2px; }
.finbars rect { fill: var(--malachite); }
.finbars rect.pre { opacity: .35; }
.finbars line { stroke: var(--gold); stroke-width: 1; }
.finbars text { font-size: 10.5px; fill: var(--fg-3); }
.prose.sm { font-size: 13px; line-height: 1.75; margin-top: 8px; }
.prose.dim { color: var(--fg-3); font-size: 12px; }
.prose b { color: var(--fg); }
.seahead { display: flex; align-items: baseline; gap: 10px; }
.seav { font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
.seaw { font-size: 12.5px; color: var(--fg-2); }
.gauge { position: relative; height: 8px; margin-top: 10px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); }
.gauge .band { position: absolute; top: -1px; bottom: -1px; background: color-mix(in srgb, var(--gold) 34%, transparent); }
.gauge .mk { position: absolute; top: -5px; width: 3px; height: 18px; margin-left: -1.5px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--panel); }
.gscale { position: relative; height: 16px; margin-top: 6px; font-size: 11px; color: var(--fg-3); }
.gscale span { position: absolute; transform: translateX(-50%); }
.gscale span:first-child { transform: none; }
.gscale span:last-child { transform: translateX(-100%); }
.fam .linkbtn { letter-spacing: 0; margin-left: 8px; font-size: 12px; }
.pill.cand { border-style: dashed; }

@media (max-width: 900px) {
  body { overflow: auto; }
  #app { position: static; display: block; padding-left: 0; padding-right: 0; padding-top: env(safe-area-inset-top, 0px); }
  #stage { height: calc(100vw * 0.66 + 118px); max-height: 640px; min-height: 330px; }
  #panel { border-left: 0; border-top: 1px solid var(--line); }
  #pages { overflow: visible; }
  #plate { max-width: 70%; }
  #plate .when { font-size: 30px; }
  #plate.boxed { background: var(--panel); padding: 8px 12px 9px; border-radius: 10px; border: 1px solid var(--line); box-shadow: 0 2px 12px rgba(0,0,0,.12); }
#plate .legend { display: none; }
  #survivor { top: auto; bottom: 10px; right: 10px; max-width: 220px; font-size: 12px; }
  #tools { right: 10px; top: 10px; }
  #tgDelist { top: auto; right: auto; left: 10px; bottom: 10px; padding: 5px 10px; font-size: 12px; }
  #survivor { bottom: 48px; left: 10px; right: auto; }
  #timebar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); z-index: 6; }
  #track { height: 64px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="map" aria-label="A股行业市值版图"></canvas>
    <div id="plate">
      <div class="kicker">A股疆域图</div>
      <div class="when" id="when">2026年10月</div>
      <div class="sum num" id="sum"></div>
      <div class="legend">面积 = 月末总市值 · 浅色小块是较小的公司 · <span class="hatchkey"></span>斜线为估算</div>
    </div>
    <div id="tools">
      <div class="zoombox" role="group" aria-label="缩放">
        <button id="zin" title="放大" aria-label="放大">+</button>
        <button id="zout" title="缩小" aria-label="缩小">−</button>
        <button id="zreset" title="复位" aria-label="复位" style="font-size:13px">⤢</button>
      </div>
    </div>
    <button class="chipbtn" id="tgDelist" aria-pressed="false"><span class="dot"></span>标出日后退市的公司</button>
    <div id="survivor" hidden></div>
    <div id="tip" hidden></div>
  </div>

  <div id="timebar">
    <div id="playbox">
      <button id="play" aria-label="播放"><svg viewBox="0 0 16 16" id="playicon"><path d="M4 2.5v11l9-5.5z"/></svg></button>
      <button id="speed" aria-label="播放速度">每秒半年</button>
      <button id="tmode" aria-label="切换时间轴显示的内容" title="时间轴可以显示各国份额，或显示海平面（市值÷GDP）">看海平面</button>
    </div>
    <div id="trackwrap">
      <canvas id="track" aria-label="时间轴：拖动选择年月"></canvas>
    </div>
  </div>

  <aside id="panel">
    <div id="searchbox">
      <input id="search" type="search" placeholder="找公司：名称、曾用名或代码" autocomplete="off" aria-label="搜索公司">
      <div id="suggest" hidden></div>
    </div>
    <div id="tabs" role="tablist">
      <button role="tab" data-tab="now" aria-selected="true">此时</button>
      <button role="tab" data-tab="realms" aria-selected="false">诸国</button>
      <button role="tab" data-tab="detail" aria-selected="false">详情</button>
      <button role="tab" data-tab="notes" aria-selected="false">资料与边界</button>
      <a class="out" id="toTide" href="guanchao.html" title="从这张图里读出的六条规律">观潮</a>
      <a class="out" id="toFind" href="faxian.html" title="发现好公司：从学科、产业、公司、价格筛四遍">好公司</a>
      <a class="out" id="toDetect" href="zhencha.html" title="财报侦探：财务指标与财报里的线索">侦探</a>
      <a class="out" id="toHK" href="ganggu.html" title="港股通：从港股通里挑公司">港股</a>
      <a class="out" id="toGame" href="chiyou.html" title="持有一月、三月、一年：用真实历史练眼力的小游戏">一月</a>

    <div id="pages">
      <section class="page" data-page="now"></section>
      <section class="page" data-page="realms" hidden></section>
      <section class="page" data-page="detail" hidden><p class="empty">点地图上的一块，或在上方搜索公司，这里会显示它的版图变迁。</p></section>
      <section class="page notes" data-page="notes" hidden></section>
    </div>
  </aside>
</div>

<script src="assets/lib/d3.min.js"></script>

<script>
"use strict";
// ---------------------------------------------------------------- 数据
const DATA = window.AGU_DATA;
const LAY = window.AGU_LAYOUT;
const MONTHS = DATA.months, NM = MONTHS.length, LAST = NM - 1;
const EX = window.AGU_EXTRA, CANDL = window.AGU_CAND;
const K0 = DATA.sectors.length, T0 = CANDL.t0;   // T0：候选国出现的月份
const SECT = DATA.sectors.map(([k, n, f], i) => ({ i, k, n, f }));

  const ly = +MONTHS[o.a].slice(0, 4), last10 = roe.slice(NY - 10).filter(isFinite), avg = last10.length ? last10.reduce((x, y) => x + y, 0) / last10.length : NaN;
  const W = 320, H = 64, bw = W / NY, vals = roe.filter(isFinite), mx = Math.min(60, Math.max(20, ...vals)), mn = Math.max(-30, Math.min(0, ...vals)), y = v => 4 + (mx - Math.max(mn, Math.min(mx, v))) / (mx - mn) * (H - 18);
  const bars = roe.map((v, k) => isFinite(v) ? `<rect class="${FIN.fy0 + k < ly ? 'pre' : ''}" x="${(k * bw + 1.5).toFixed(1)}" y="${Math.min(y(v), y(0)).toFixed(1)}" width="${(bw - 3).toFixed(1)}" height="${Math.max(1, Math.abs(y(v) - y(0))).toFixed(1)}" rx="1.5"></rect>` : '').join('');
  const n1 = ni[NY - 1], pe = o.b === LAST && n1 > 0 ? capAt(o, LAST) / n1 : NaN;
  return `<svg class="finbars" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="历年净资产收益率"><line x1="0" x2="${W}" y1="${y(15).toFixed(1)}" y2="${y(15).toFixed(1)}"></line>${bars}</svg>
    <div class="prose sm dim" style="display:flex;justify-content:space-between;margin-top:0"><span>${FIN.fy0}</span><span>净资产收益率，金线是15%${FIN.fy0 < ly ? '，浅色为上市前' : ''}</span><span>${FIN.fy1}</span></div>
    <dl class="facts num">${last10.length ? `<dt>${last10.length === 10 ? '十年平均' : '近' + last10.length + '年平均'}</dt><dd>净资产收益率 ${avg.toFixed(1).replace('-', '−')}%，${last10.filter(v => v >= 15).length} 年在15%以上</dd>` : ''}
      ${isFinite(n1) ? `<dt>${FIN.fy1}年</dt><dd>归母净利润 ${n1 < 0 ? '−' : ''}${fmtYi(Math.abs(n1))}${o.b === LAST ? (isFinite(pe) ? `，市盈率 ${pe >= 100 ? Math.round(pe) : pe.toFixed(1)} 倍` : '，亏损') : ''}</dd>` : ''}</dl>
    <p class="prose sm" style="margin-top:8px">${link}</p>`;
}
function select(sel) {
  selected = sel; showTab('detail'); draw();
  if (sel.type === 'co') {
    const o = CO[sel.j]; const t = Math.round(T);
    if (t < o.a || t > o.b) { /* 让用户自己决定是否跳转 */ }
  }
}

// ---------------------------------------------------------------- 搜索
const SEARCH = CO.map(o => ({ o, keys: [o.name, ...o.ren.map(r => r[1]), o.code].join(' ').toLowerCase() }));
function maxCap(o) { if (o._mx === undefined) { let m = 0; for (let t = o.a; t <= o.b; t++) m = Math.max(m, capAt(o, t)); o._mx = m; } return o._mx; }
const sIn = document.getElementById('search'), sBox = document.getElementById('suggest');
let sItems = [], sOn = -1;
sIn.addEventListener('input', () => {
  const q = sIn.value.trim().toLowerCase();
  if (!q) { sBox.hidden = true; return; }
  const t = Math.round(T);
  sItems = SEARCH.filter(x => x.keys.includes(q)).map(x => x.o)
    .sort((a, b) => ((b.name.toLowerCase() === q) - (a.name.toLowerCase() === q)) || (maxCap(b) - maxCap(a))).slice(0, 8);
  sOn = -1;
  if (!sItems.length) { sBox.innerHTML = '<div style="padding:10px 12px;color:var(--fg-3)">没有找到。本图只收沪深A股（不含北交所）。</div>'; sBox.hidden = false; return; }
  sBox.innerHTML = sItems.map((o, i) => {
    const s = SECT[secAt(o, o.b)];
    const meta = `${ymShort(o.a)}–${o.b < LAST ? ymShort(o.b) + ' 退市' : '至今'} · ${s.n}`;
    const alias = o.ren.length ? ` · 曾用名 ${o.ren.map(r => r[1]).join('、')}` : '';
    return `<button data-i="${i}"><span class="n">${o.name}</span><span class="c num">${o.code}</span><span class="m">${meta}${alias}</span></button>`;
  }).join('');
  sBox.hidden = false;
  sBox.querySelectorAll('button').forEach(b => b.onclick = () => pick(sItems[+b.dataset.i]));
});
sIn.addEventListener('keydown', e => {
  if (sBox.hidden || !sItems.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sOn = (sOn + (e.key === 'ArrowDown' ? 1 : -1) + sItems.length) % sItems.length; sBox.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === sOn)); }
  if (e.key === 'Enter') { e.preventDefault(); pick(sItems[Math.max(0, sOn)]); }
  if (e.key === 'Escape') sBox.hidden = true;
});
document.addEventListener('click', e => { if (!document.getElementById('searchbox').contains(e.target)) sBox.hidden = true; });
function pick(o) {
  sBox.hidden = true; sIn.value = o.name; stop();
  const t = Math.round(T);
  if (t < o.a || t > o.b) setTime(o.b < LAST ? o.b : Math.max(o.a, t), true);
  select({ type: 'co', j: o.j });
}

// ---------------------------------------------------------------- 资料与边界
pages.notes.innerHTML = `
<h3>这张图画的是什么</h3>
<p>每个“国”是一个行业，面积等于该行业所有公司在月末的总市值之和；国内的每座“城”是一家公司。每月取最后一个交易日，2000年1月到2026年10月共322个月。较小的公司合并成带斜线的“其余N家”。</p>
<h3>数据从哪里来</h3>
<ul>
<li>每日价格（含已退市公司）：<a href="https://github.com/chenditc/investment_data" target="_blank" rel="noopener">chenditc/investment_data</a> 的 qlib 数据包，整合了 Wind、Tushare 等来源，2000年起。</li>
<li>总市值与总股本：<a href="https://github.com/L2Wscorpio/ashare-market-data" target="_blank" rel="noopener">L2Wscorpio/ashare-market-data</a> 的估值表，2000年起。</li>
<li>流通股本、逐月证监会行业分类、公司名称：<a href="https://github.com/noblechang/a-share-data" target="_blank" rel="noopener">noblechang/a-share-data</a>（BaoStock 数据快照，2010年起，含退市股）。</li>
<li>公司详情里的年报摘要、“发现好公司”页的财报和持股回报：三大报表取自 L2Wscorpio/ashare-market-data（2010–2025年报），复权价取自 chenditc/investment_data。</li>
</ul>
<h3>怎么算的</h3>
<ul>
<li>市值 = 月末收盘价 × 总股本。总股本按行情软件的通行口径，含H股等境外股份，按A股价格折算。所以工商银行、中国石油这类A+H公司的版图偏大，“本图合计”通常比交易所公布的A股市值高一成左右。</li>
<li>第二个来源的总股本在2026年5月以前有不少错误（有的差10倍以上）。本图用流通股本做下限交叉校验，并修正了只持续一两个月的来回跳变；仍可能有个别公司个别月份不准。</li>
<li>${CO.filter(o => o.est.length).length} 家公司部分月份没有总股本：2010年以后用流通股本代替（锁定期按解禁后的股本回填），2010年以前按同期小盘股“成交额/市值”的比例由成交额推算。这些月份在图上画斜线。估算部分在2000年约占全图13%，2010年后不到3%，2020年后不到1.5%。</li>
</ul>
<h3>行业怎么分</h3>
<ul>
<li>基础是证监会行业分类（2012年版，约80个大类），合并成30个国。2013年以前统一用公司最早的2012版分类；2013年起按当月分类，公司转行时会从一国划到另一国。</li>
<li>白酒（19家）、家电（26家）、半导体（64家）、AI算力（20家，2023年1月起）是本项目按公司名单划出的，名单在“诸国”里带“名单”标记。另有十来家公司按主业做了调整，例如东方财富2016年起归证券，中国中车归机械。</li>
<li>借壳上市的券商（海通、长江、国元、广发等），借壳以前按壳公司的名称和行业显示。</li>
<li>候选国：${EX.cand.map(c => `${c.n}（${c.codes.length}家）`).join('、')}。它们是还在形成中的行业，2023年1月起用虚线国界画出，名单里的公司从原来的国里划出；名单是按主营业务人工挑选的，边界有主观成分。在“诸国”里可以把候选国从地图上隐去，回到原来的30国。行业份额的历史峰值等统计，一律按原来的30国计算。</li>
</ul>
<h3>海平面是什么</h3>
<ul>
<li>海平面 = 本图合计市值 ÷ 近一年名义GDP，也就是常说的“股市总市值与GDP之比”。水位高，说明股市相对经济的规模大。年度GDP在月份之间做线性插值。</li>
<li>GDP用国家统计局数据：${EX.gdpNote}因为本图合计比交易所口径高一成左右，这里的海平面也相应偏高。</li>
<li>“常见区间60%–80%”是经验区间：2010年以来约六成的月份落在其中。它不是买卖信号。</li>
<li>“老公司的市值”（地价指数）：每个月只比较前后两个月都在图上的公司，新上市带来的面积不计入。它包含增发带来的市值增加，不包含分红，所以不等于持有股票的回报。</li>
</ul>
<h3>没有画进来的</h3>
<ul>
<li>1990–1999年：没有能免费取得的逐股市值数据，只在“此时”里用文字讲。</li>
<li>北京证券交易所、B股、2026年9月18日之后上市的6家新股（缺股本数据）。</li>
</ul>
<h3>哪里可能不准</h3>
<ul>
<li>名称：一律用公司现名或退市前的最后名称；约三十家知名公司按改名时间显示旧名（如中国南车、青岛海尔、国泰君安、苏宁电器）。其余公司早年的名字可能和图上不同。</li>
<li>“退市”包括被吸收合并（如中国北车、海通证券），${CO.filter(o => o.b < LAST).length} 家。</li>
<li>本图适合看行业版图的大势，不宜当作个股数据来源，也不构成投资建议。时代解说由 AI（Claude）编写，可能有错漏。</li>
</ul>
<p class="foot">最后一帧：2026年10月30日收盘。<br><a href="guanchao.html">观潮：从这张图里读出的六条规律</a> · <a href="faxian.html">发现好公司</a> · <a href="zhencha.html">财报侦探</a> · <a href="ganggu.html">港股通</a> · <a href="chiyou.html">持有一月</a> · <a href="sanyue.html">持有三月</a> · <a href="yinian.html">持有一年</a> · <a href="kanshu.html">看数</a> · <a href="video.html">观看使用讲解视频（4分38秒）</a> · <a href="https://github.com/wanglu2016/agu-jiangyu" target="_blank" rel="noopener">源代码与离线版</a></p>`;

// ---------------------------------------------------------------- 启动
refreshColors();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { refreshColors(); draw(); drawTrack(); renderPanels(); });
new MutationObserver(() => { refreshColors(); draw(); drawTrack(); renderPanels(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
const h0 = location.hash.slice(1); const i0 = MONTHS.indexOf(h0); if (i0 >= 0) T = i0;
const hashCo = () => { const h = location.hash.slice(1); return h.startsWith('co=') ? byCode.get(h.slice(3)) : null; };   // faxian.html 里“在地图上看这座城”
const co0 = hashCo(); if (co0) { if (T < co0.a || T > co0.b) T = co0.b; selected = { type: 'co', j: co0.j }; }
window.addEventListener('hashchange', () => { const o = hashCo(); if (o) { pick(o); return; } const i = MONTHS.indexOf(location.hash.slice(1)); if (i >= 0 && i !== Math.round(T)) { stop(); setTime(i, false); } });

}
